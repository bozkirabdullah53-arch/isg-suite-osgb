# Render Blueprint — eğitim belgesi ve sınav davranışları kaynak kontrollüdür; build kaynak dosyaları değiştirmez.
services:
  - type: web
    name: isg-suite-remote-training-isolated-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /health
    branch: agent/remote-training-isolated-render-20260814
    disk:
      name: isg-suite-remote-training-isolated-api-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: staging
      # Verified NACE records must always use the frozen five-topic snapshot;
      # cross-sector legacy aliases are not allowed to select live exam questions.
      - key: TRAINING_EXACT_NACE_EXAM_STRICT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: isg-suite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://isg-suite-remote-training-isolated-web.onrender.com
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ASYNC_JOBS_FORCE_OFF
        value: "false"
      - key: ASYNC_JOBS_ENABLED
        value: "true"
      - key: OBJECT_STORAGE_BACKEND
        value: "local"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_PREFIX
        value: "isg-suite-osgb"
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: UPLOAD_GATEWAY_ENABLED
        value: "true"
      - key: UPLOAD_GATEWAY_FORCE_OFF
        value: "false"
      - key: AUTH_REFRESH_COOKIE_ENABLED
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES_SHORT
        value: "15"
      - key: AUTH_REFRESH_COOKIE_FORCE_OFF
        value: "false"
      - key: HEALTH_FIELD_ENCRYPTION_ENABLED
        value: "false"
      - key: HEALTH_FIELD_ENCRYPTION_KEY
        sync: false
      - key: HEALTH_FIELD_ENCRYPTION_FORCE_OFF
        value: "false"
      - key: OBJECT_STORAGE_AUTO_CUTOVER
        value: "true"
      - key: OBJECT_STORAGE_FORCE_LOCAL
        value: "false"
      - key: BACKUP_RESTORE_ENABLED
        value: "false"
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_FORCE_OFF
        value: "false"
      - key: CLAMAV_HOST
        sync: false
      # Emergency compatibility rollback: keep the established training PDF,
      # certificate and presentation flows available while strict V2/V3 gates
      # are completed for the full sector catalog.
      - key: TRAINING_COMPLETION_STRICT
        value: "false"
      - key: NACE_TRAINING_PRESENTATION_TRACEABILITY_FORCE_OFF
        value: "true"
      # Remote Basic OHS package/catalog management is live. Employee access
      # still requires an explicit assignment; the strict sector policy remains
      # enforced separately below.
      - key: REMOTE_BASIC_OHS_TRAINING_ENABLED
        value: "true"
      - key: REMOTE_BASIC_OHS_TRAINING_FORCE_OFF
        value: "false"
      - key: REMOTE_BASIC_OHS_VIDEO_MAX_UPLOAD_MB
        value: "2048"
      - key: REMOTE_BASIC_OHS_PLAYBACK_TTL_SECONDS
        value: "300"
      # Firma ve sektör ataması yöneticinin seçimiyle yapılır.  Otomatik firma
      # ataması yoktur; boş şirket allowlist'i tüm firmaların yöneticinin
      # seçtiği yayımlanmış sektör paketlerini alabilmesini sağlar.
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_ENABLED
        value: "true"
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_FORCE_OFF
        value: "false"
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_PACKAGE_CODES
        value: "common-basic-ohs,construction-ohs,metal-machine-ohs,battery-production-ohs,food-production-ohs,logistics-warehouse-transport-ohs,chemical-paint-production-ohs,open-mine-quarry-aggregate-ohs,road-asphalt-infrastructure-ohs,office-general-ohs,working-at-height-ohs"
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_PILOT_COMPANY_IDS
        value: ""


  - type: web
    name: isg-suite-remote-training-isolated-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && node scripts/apply_training_color_theme.mjs && node scripts/activate_training_exam.mjs && npm run build
    staticPublishPath: dist
    branch: agent/remote-training-isolated-render-20260814
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: /api/v1
    routes:
      - type: rewrite
        source: /api/*
        destination: https://isg-suite-remote-training-isolated-api.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://isg-suite-remote-training-isolated-api.onrender.com/health
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: isg-suite-remote-training-isolated-db
    databaseName: isg_suite_remote_training_isolated_db
    user: isg_suite_remote_training_isolated_db_user
