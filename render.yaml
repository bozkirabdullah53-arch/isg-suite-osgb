# Render Blueprint — eğitim belgesi ve sınav davranışları kaynak kontrollüdür; build kaynak dosyaları değiştirmez.
services:
  - type: web
    name: isg-suite-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /health
    branch: master
    disk:
      name: isg-suite-api-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: isg-suite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://www.isgsuite.tr
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ASYNC_JOBS_FORCE_OFF
        value: "false"
      - key: ASYNC_JOBS_ENABLED
        value: "true"
      - key: OBJECT_STORAGE_BACKEND
        value: "local"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_PREFIX
        value: "isg-suite-osgb"
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: UPLOAD_GATEWAY_ENABLED
        value: "true"
      - key: UPLOAD_GATEWAY_FORCE_OFF
        value: "false"
      - key: AUTH_REFRESH_COOKIE_ENABLED
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES_SHORT
        value: "15"
      - key: AUTH_REFRESH_COOKIE_FORCE_OFF
        value: "false"
      - key: HEALTH_FIELD_ENCRYPTION_ENABLED
        value: "false"
      - key: HEALTH_FIELD_ENCRYPTION_KEY
        sync: false
      - key: HEALTH_FIELD_ENCRYPTION_FORCE_OFF
        value: "false"
      - key: OBJECT_STORAGE_AUTO_CUTOVER
        value: "true"
      - key: OBJECT_STORAGE_FORCE_LOCAL
        value: "false"
      - key: BACKUP_RESTORE_ENABLED
        value: "false"
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_FORCE_OFF
        value: "false"
      - key: CLAMAV_HOST
        sync: false
      # Emergency compatibility rollback: keep the established training PDF,
      # certificate and presentation flows available while strict V2/V3 gates
      # are completed for the full sector catalog.
      - key: TRAINING_COMPLETION_STRICT
        value: "false"
      - key: NACE_TRAINING_PRESENTATION_TRACEABILITY_FORCE_OFF
        value: "true"

  - type: cron
    name: isg-suite-api-warmup
    runtime: python
    rootDir: backend
    schedule: "*/14 * * * *"
    buildCommand: "true"
    startCommand: python scripts/warmup_ping.py
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WARMUP_API_URL
        value: https://isg-suite-api-1u9t.onrender.com

  - type: web
    name: isg-suite-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && node scripts/apply_training_color_theme.mjs && node scripts/activate_training_exam.mjs && npm run build
    staticPublishPath: dist
    branch: master
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: /api/v1
    routes:
      - type: rewrite
        source: /api/*
        destination: https://isg-suite-api-1u9t.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://isg-suite-api-1u9t.onrender.com/health
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: isg-suite-db
    databaseName: isgsuite
    user: isgsuite
