# Render Blueprint — eğitim belgesi ve sınav davranışları kaynak kontrollüdür; build kaynak dosyaları değiştirmez.
services:
  - type: web
    name: isg-suite-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /health
    branch: master
    disk:
      name: isg-suite-api-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      # Verified NACE records must always use the frozen five-topic snapshot;
      # cross-sector legacy aliases are not allowed to select live exam questions.
      - key: TRAINING_EXACT_NACE_EXAM_STRICT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: isg-suite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://www.isgsuite.tr
      - key: SMTP_HOST
        value: mail.isgsuite.tr
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: info@isgsuite.tr
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: info@isgsuite.tr
      # F-01 ENGELLENDİ (2026-09-21 probe): mail.isgsuite.tr:587 EHLO'da STARTTLS
      # YOK; 465/993/995 timeout; pop3.isgsuite.tr CAPA'da STLS YOK (isimtescil
      # "Mail Server 2"). TLS'i şimdi açmak parola sıfırlama mailini ve inbox
      # senkronunu KIRARDI. Mevcut çalışan değerler korunuyor.
      #
      # BREVO SMTP RELAY CUTOVER (onaylandı 2026-09-21 — docs/SECURITY_INFRA_ROLLOUT.md):
      # Brevo hesabı + domain auth (SPF/DKIM) hazır olunca Render Dashboard'da:
      #   SMTP_HOST     = smtp-relay.brevo.com
      #   SMTP_PORT     = 587
      #   SMTP_USE_TLS  = true
      #   SMTP_USERNAME = <Brevo SMTP login>        (secret — sync:false)
      #   SMTP_PASSWORD = <Brevo SMTP key>          (secret — sync:false)
      #   SMTP_FROM_EMAIL = info@isgsuite.tr        (Brevo'da doğrulanmış domain)
      # Doğrulama: parola sıfırlama maili uçtan uca + delivery log "sent".
      # Kod değişikliği GEREKMEZ (mailer.py SMTP/STARTTLS destekli).
      - key: SMTP_USE_TLS
        value: "false"
      - key: SMTP_USE_SSL
        value: "false"
      # EİSA Global gelen kutusu — kullanıcı adı ve parola Render Secret olarak eklenir.
      - key: INBOUND_MAIL_ENABLED
        value: "true"
      - key: INBOUND_MAIL_HOST
        value: pop3.isgsuite.tr
      - key: INBOUND_MAIL_PORT
        value: "110"
      - key: INBOUND_MAIL_USERNAME
        value: info@isgsuite.tr
      - key: INBOUND_MAIL_PASSWORD
        sync: false
      - key: INBOUND_MAIL_USE_SSL
        value: "false"
      - key: INBOUND_MAIL_PROTOCOL
        value: pop3
      - key: INBOUND_MAIL_FOLDER
        value: INBOX
      - key: INBOUND_MAIL_SYNC_LIMIT
        value: "50"
      - key: INBOUND_MAIL_TIMEOUT_SEC
        value: "20"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # F-06: Render Key Value (Redis) oluşturup REDIS_URL'i buraya bağlayın —
      # rate_limit.py otomatik Redis backend'e geçer; boş/erişilemezse bellek içi
      # yedek devrede kalır (canlıyı bozmaz). Adımlar: docs/SECURITY_INFRA_ROLLOUT.md
      - key: REDIS_URL
        sync: false
      - key: ASYNC_JOBS_FORCE_OFF
        value: "false"
      - key: ASYNC_JOBS_ENABLED
        value: "true"
      - key: OBJECT_STORAGE_BACKEND
        value: "local"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_PREFIX
        value: "isg-suite-osgb"
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: UPLOAD_GATEWAY_ENABLED
        value: "true"
      - key: UPLOAD_GATEWAY_FORCE_OFF
        value: "false"
      - key: AUTH_REFRESH_COOKIE_ENABLED
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES_SHORT
        value: "15"
      - key: AUTH_REFRESH_COOKIE_FORCE_OFF
        value: "false"
      - key: HEALTH_FIELD_ENCRYPTION_ENABLED
        value: "true"
      - key: HEALTH_FIELD_ENCRYPTION_KEY
        sync: false
      - key: HEALTH_FIELD_ENCRYPTION_FORCE_OFF
        value: "false"
      - key: OBJECT_STORAGE_AUTO_CUTOVER
        value: "true"
      - key: OBJECT_STORAGE_FORCE_LOCAL
        value: "false"
      # One-shot safe mirror; enable temporarily only after R2 probe succeeds.
      # The job is idempotent and never deletes persistent-disk videos.
      - key: OBJECT_STORAGE_VIDEO_BACKFILL_ON_STARTUP
        value: "false"
      # F-04 (2026-09-21): canlı geri yükleme yazımı kapalı. Restore yalnızca
      # bakım penceresinde geçici açılır; dry-run/restore-plan her zaman çalışır.
      - key: BACKUP_RESTORE_ENABLED
        value: "false"
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_FORCE_OFF
        value: "false"
      # İBYS Yedekleme Prosedürü: günlük tam veritabanı yedeği + offsite kopya.
      #
      # GÜVENLİ ROLLOUT (kademeli):
      #   Aşama 1 (şimdi): BACKUP_REMOTE_ENABLED=true, REQUIRED=false.
      #     Yedek R2/S3'e yüklenir ve boyut+SHA-256 ile doğrulanır. Kimlik bilgisi
      #     eksik/erişilemezse uygulama YİNE DE AÇILIR (canlı düşmez) ancak
      #     global yöneticilere kritik alarm gider ve cron exit 1 döner.
      #   Aşama 2 (offsite yüklemenin çalıştığı doğrulandıktan sonra):
      #     BACKUP_REMOTE_REQUIRED=true yapın. O andan itibaren kimlik bilgisi
      #     eksikse production BAŞLAMAZ (fail-closed).
      - key: DB_BACKUP_ENABLED
        value: "true"
      - key: DB_BACKUP_RETENTION_DAYS
        value: "30"
      - key: DB_BACKUP_WEEKLY_RETENTION_WEEKS
        value: "12"
      - key: DB_BACKUP_MONTHLY_RETENTION_MONTHS
        value: "12"
      - key: BACKUP_REMOTE_ENABLED
        value: "true"
      - key: BACKUP_REMOTE_PREFIX
        value: "db-backups"
      - key: BACKUP_REMOTE_REQUIRED
        value: "false"
      - key: BACKUP_MAX_AGE_HOURS
        value: "36"
      # F-05 (2026-09-21): ClamAV altyapı kararı bekliyor. Render'da bir clamd
      # servisi kurulup CLAMAV_HOST (sync:false secret slot) doldurulduktan
      # sonra CLAMAV_REQUIRED="true" yapılmalı — fail-closed: host'sız prod
      # başlamaz (config.py validate_runtime_settings). Şu an magic-byte +
      # uzantı filtresi geçerli; bu yüzden REQUIRED temkinli false bırakıldı.
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_REQUIRED
        value: "false"
      # Controlled compliance cutover: existing and pre-cutover verified
      # trainings keep the established certificate flow; only new verified
      # NACE snapshot trainings after the timestamp use completion preflight.
      - key: TRAINING_COMPLETION_STRICT
        value: "true"
      - key: TRAINING_COMPLETION_STRICT_AFTER
        value: "2026-08-20T12:10:00Z"
      - key: NACE_TRAINING_PRESENTATION_TRACEABILITY_FORCE_OFF
        value: "true"
      # Remote Basic OHS package/catalog management is live. Employee access
      # still requires an explicit assignment; the strict sector policy remains
      # enforced separately below.
      - key: REMOTE_BASIC_OHS_TRAINING_ENABLED
        value: "true"
      - key: REMOTE_BASIC_OHS_TRAINING_FORCE_OFF
        value: "false"
      - key: REMOTE_BASIC_OHS_VIDEO_MAX_UPLOAD_MB
        value: "2048"
      - key: REMOTE_BASIC_OHS_PLAYBACK_TTL_SECONDS
        value: "300"
      # Deploy ile davranış değişmez. R2 doğrulandıktan sonra Dashboard'dan
      # kontrollü açılır; FORCE_OFF anında mevcut yerel akışa döndürür.
      - key: REMOTE_BASIC_OHS_DIRECT_OBJECT_PLAYBACK_ENABLED
        value: "false"
      - key: REMOTE_BASIC_OHS_DIRECT_OBJECT_PLAYBACK_FORCE_OFF
        value: "false"
      - key: REMOTE_BASIC_OHS_DIRECT_OBJECT_PLAYBACK_TTL_SECONDS
        value: "3600"
      # Firma ve sektör ataması yöneticinin seçimiyle yapılır. Otomatik firma
      # ataması yoktur; boş şirket allowlist'i tüm firmaların yöneticinin
      # seçtiği yayımlanmış sektör paketlerini alabilmesini sağlar.
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_ENABLED
        value: "true"
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_FORCE_OFF
        value: "false"
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_PACKAGE_CODES
        value: "common-basic-ohs,construction-ohs,metal-machine-ohs,battery-production-ohs,food-production-ohs,logistics-warehouse-transport-ohs,chemical-paint-production-ohs,open-mine-quarry-aggregate-ohs,road-asphalt-infrastructure-ohs,office-general-ohs,health-services-ohs,working-at-height-ohs,emergency-teams-ohs"
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_PILOT_COMPANY_IDS
        value: ""
      # 0.9.246 — Saha fotoğrafı AI risk analizi. Default heuristic mod
      # (ücretli API key gerekmez, görüntü içeriği analiz edilmez).
      # vision_provider=api + vision_api_key ile gerçek görüntü analizi açılır.
      - key: VISION_ANALYSIS_ENABLED
        value: "true"
      - key: VISION_PROVIDER
        value: "api"
      - key: VISION_API_BASE_URL
        value: "https://api.xkiro.com/v1"
      - key: VISION_API_MODEL
        value: "openai/gpt-5.4-mini"
      # Vision sağlayıcısının 30 saniyeyi aşabilen yanıtları için.
      - key: VISION_API_TIMEOUT_SEC
        value: "90"
      # API anahtarı gizli — Render dashboard'da manuel eklenir (sync: false).
      - key: VISION_API_KEY
        sync: false
      # 0.9.246 — Yeni GPS'li görsel saha denetimi akışı. Bu değişkenler
      # eski VISION_* akışından ayrıdır; anahtar yoksa backend mevcut
      # VISION_API_KEY sırrını güvenli geriye dönük uyumluluk köprüsüyle kullanır.
      - key: FIELD_AI_ENABLED
        value: "true"
      - key: FIELD_AI_FORCE_OFF
        value: "false"
      - key: FIELD_AI_PROVIDER
        value: "openai_compatible"
      - key: FIELD_AI_API_URL
        value: "https://api.xkiro.com/v1/chat/completions"
      - key: FIELD_AI_MODEL
        value: "openai/gpt-5.4-mini"
      - key: FIELD_AI_MODEL_VERSION
        value: "configured"
      - key: FIELD_AI_PROMPT_VERSION
        value: "field-visual-v2"
      - key: FIELD_AI_TIMEOUT_SECONDS
        value: "90"
      # Görsel saha AI pilotu için dış veri işleme açıkça etkinleştirilmiştir;
      # gerçek rapor bulgusu yine uzman onayından geçer.
      - key: FIELD_AI_DATA_PROCESSING_ALLOWED
        value: "true"
      # İstenirse yeni ayrı anahtar burada tanımlanabilir. Boş bırakıldığında
      # backend mevcut VISION_API_KEY değerini kullanır; gerçek sır commit edilmez.
      - key: FIELD_AI_API_KEY
        sync: false
      - key: CONTEXTUAL_ASSISTANT_ENABLED
        value: "true"
      - key: CONTEXTUAL_ASSISTANT_FORCE_OFF
        value: "false"
      - key: CONTEXTUAL_ASSISTANT_API_URL
        sync: false
      - key: CONTEXTUAL_ASSISTANT_API_KEY
        sync: false
      - key: CONTEXTUAL_ASSISTANT_MODEL
        sync: false
      - key: CONTEXTUAL_ASSISTANT_TIMEOUT_SECONDS
        value: "30"
      # Sesli soru girişi yalnızca kullanıcı mikrofon düğmesine basınca etkinleşir.
      # Kayıt sunucuda tutulmaz; provider yoksa yazılı asistan çalışmaya devam eder.
      - key: CONTEXTUAL_ASSISTANT_TRANSCRIPTION_ENABLED
        value: "true"
      - key: CONTEXTUAL_ASSISTANT_TRANSCRIPTION_FORCE_OFF
        value: "false"
      - key: CONTEXTUAL_ASSISTANT_TRANSCRIPTION_MODEL
        value: "whisper-1"
      - key: CONTEXTUAL_ASSISTANT_TRANSCRIPTION_MAX_MB
        value: "5"
      - key: EMPLOYEE_SELF_SERVICE_ENABLED
        value: "true"
      - key: EMPLOYEE_SELF_SERVICE_FORCE_OFF
        value: "false"
      - key: WORKPLACE_BACKUPS_ENABLED
        value: "true"
      - key: WORKPLACE_BACKUPS_FORCE_OFF
        value: "false"
      - key: WORKPLACE_BACKUP_RETENTION_DAYS
        value: "30"
      - key: WORKPLACE_BACKUP_HOUR_TR
        value: "2"
      - key: WORKPLACE_BACKUP_CRON_TOKEN
        sync: false
      - key: WORKPLACE_BACKUP_REMOTE_ENABLED
        value: "true"
      - key: WORKPLACE_BACKUP_REMOTE_PREFIX
        value: "workplace-backups"

  # 23:00 UTC = Türkiye saatiyle 02:00. Yedek dosyasını geçici cron diskinde
  # üretmez; imzalı çağrıyla API servisinin kalıcı diskinde oluşturur.
  - type: cron
    name: isg-suite-workplace-backups-nightly
    runtime: python
    rootDir: backend
    schedule: "0 23 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m scripts.workplace_backup_cron
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WORKPLACE_BACKUPS_ENABLED
        value: "true"
      - key: WORKPLACE_BACKUP_TRIGGER_URL
        value: https://isg-suite-api-1u9t.onrender.com/api/v1/workplace-backups/internal/run-scheduled
      - key: WORKPLACE_BACKUP_CRON_TOKEN
        sync: false

  # 22:00 UTC = Türkiye saatiyle 01:00. Tam veritabanı yedeği (pg_dump) üretir,
  # şifreler, R2/S3 offsite kopyasını doğrular ve GFS retention uygular.
  - type: cron
    name: isg-suite-db-backup-nightly
    runtime: python
    rootDir: backend
    schedule: "0 22 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m scripts.backup_database
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: isg-suite-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: DB_BACKUP_ENABLED
        value: "true"
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_FORCE_OFF
        value: "false"
      - key: BACKUP_REMOTE_ENABLED
        value: "true"
      - key: BACKUP_REMOTE_PREFIX
        value: "db-backups"
      # Aşama 2'de "true" yapılır (yukarıdaki rollout notuna bakın).
      - key: BACKUP_REMOTE_REQUIRED
        value: "false"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false

  # Aylık gerçek yedekle geri yükleme tatbikatı (her ayın 15'i, 21:00 UTC).
  - type: cron
    name: isg-suite-backup-restore-drill-monthly
    runtime: python
    rootDir: backend
    schedule: "0 21 15 * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m scripts.backup_restore_drill --out docs/qa/logs/backup-restore-drill.json --latest
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_RESTORE_ENABLED
        value: "false"

  # Haftalık yedek bütünlük taraması (Pazar 20:00 UTC). Bozuk yedek bulunursa
  # global yöneticilere kritik bildirim gönderir.
  - type: cron
    name: isg-suite-backup-integrity-weekly
    runtime: python
    rootDir: backend
    schedule: "0 20 * * 0"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m scripts.backup_key_rotation --out docs/qa/logs/backup-integrity.json
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: isg-suite-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: BACKUP_DIR
        value: /var/data/backups

  # Günlük denetim zinciri doğrulaması (21:30 UTC = 00:30 TR). Zincir bozuksa
  # exit 1 döner ve global yöneticilere kritik bildirim gönderir.
  - type: cron
    name: isg-suite-audit-chain-verify-daily
    runtime: python
    rootDir: backend
    schedule: "30 21 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m scripts.audit_chain_verify --out docs/qa/logs/audit-chain-verify.json
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: isg-suite-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

  - type: cron
    name: isg-suite-api-warmup
    runtime: python
    rootDir: backend
    schedule: "*/14 * * * *"
    buildCommand: "true"
    startCommand: python scripts/warmup_ping.py
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WARMUP_API_URL
        value: https://isg-suite-api-1u9t.onrender.com

  - type: web
    name: isg-suite-web
    runtime: static
    rootDir: frontend
    # package.json owns the single canonical patch/test/build sequence. Do not
    # run training activation scripts twice here and again inside npm run build.
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    branch: master
    # EİSA canlı alan adı: kök alan adı www adresine yönlendirilir.
    domains:
      - www.isgsuite.tr
    # --- Güvenlik başlıkları (smoke test D2 bulgusu) ---
    # Render static sites, nginx.conf'u kullanmaz; headers direktifiyle
    # tüm yanıtlara güvenlik başlıkları eklenir.
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=(self)
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Content-Security-Policy
        # Protected video may redirect to a short-lived R2/S3 HTTPS URL. Media
        # is permitted over HTTPS while scripts, frames and API connections
        # remain restricted to their existing origins.
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' https: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json
      - path: /manifest.json
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: /api/v1
      - key: VITE_CONTEXTUAL_ASSISTANT_ENABLED
        value: "true"
      - key: VITE_CONTEXTUAL_ASSISTANT_FORCE_OFF
        value: "false"
      - key: VITE_EMPLOYEE_SELF_SERVICE_V1
        value: "true"
      - key: VITE_WORKPLACE_BACKUPS_ENABLED
        value: "true"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://isg-suite-api-1u9t.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://isg-suite-api-1u9t.onrender.com/health
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /.well-known/security.txt
        destination: /.well-known/security.txt
      - type: rewrite
        source: /manifest.json
        destination: /manifest.json
      - type: rewrite
        source: /manifest.webmanifest
        destination: /manifest.json
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: isg-suite-db
    databaseName: isgsuite
    user: isgsuite
