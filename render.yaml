services:
  - type: web
    name: isg-suite-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /health
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # P0: production sertleştirmesi (SECRET_KEY doğrulama + migration fail-fast)
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: isg-suite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://www.isgsuite.tr
      # Seed admin: Render Dashboard > Environment (sync: false)
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Redis: rate limit + async (FORCE_OFF kapalı → REDIS_URL ile async on)
      - key: REDIS_URL
        sync: false
      - key: ASYNC_JOBS_FORCE_OFF
        value: "false"
      - key: ASYNC_JOBS_ENABLED
        value: "true"
      # Object storage (P0-03) — varsayılan local; R2 credential + probe sonrası r2
      - key: OBJECT_STORAGE_BACKEND
        value: "local"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_PREFIX
        value: "uploads"
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      # Upload gateway — production kodda açık; acil: UPLOAD_GATEWAY_FORCE_OFF=true
      - key: UPLOAD_GATEWAY_ENABLED
        value: "true"
      - key: UPLOAD_GATEWAY_FORCE_OFF
        value: "false"
      # P1-01 HttpOnly refresh — production kodda açık; acil kapatma:
      # AUTH_REFRESH_COOKIE_FORCE_OFF=true
      - key: AUTH_REFRESH_COOKIE_ENABLED
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES_SHORT
        value: "15"
      - key: AUTH_REFRESH_COOKIE_FORCE_OFF
        value: "false"
      # P0-10 sağlık alan şifreleme — varsayılan kapalı; açmadan önce dedicated key
      - key: HEALTH_FIELD_ENCRYPTION_ENABLED
        value: "false"
      - key: HEALTH_FIELD_ENCRYPTION_KEY
        sync: false
      - key: HEALTH_FIELD_ENCRYPTION_FORCE_OFF
        value: "false"
      - key: OBJECT_STORAGE_AUTO_CUTOVER
        value: "true"
      - key: OBJECT_STORAGE_FORCE_LOCAL
        value: "false"
      # P0-08 yedek — restore kapalı; production'da SECRET_KEY fallback (dedicated tercih)
      - key: BACKUP_RESTORE_ENABLED
        value: "false"
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_FORCE_OFF
        value: "false"
      # Optional ClamAV (B-01): set CLAMAV_HOST when clamd is reachable
      - key: CLAMAV_HOST
        sync: false

  # B-03: free-tier sleep önleme — /health ping (UTC, ~$1/ay minimum)
  - type: cron
    name: isg-suite-api-warmup
    runtime: python
    rootDir: backend
    schedule: "*/14 * * * *"
    buildCommand: "true"
    startCommand: python scripts/warmup_ping.py
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WARMUP_API_URL
        value: https://isg-suite-api-1u9t.onrender.com

  - type: web
    name: isg-suite-web
    runtime: static
    rootDir: frontend
    # Global npm pin Render'da sık kırılıyor; Node 20 + npm ci yeterli
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    branch: master
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://isg-suite-api-1u9t.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: isg-suite-db
    databaseName: isgsuite
    user: isgsuite
