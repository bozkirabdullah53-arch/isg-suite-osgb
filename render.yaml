# Render Blueprint — eğitim belgesi ve sınav davranışları kaynak kontrollüdür; build kaynak dosyaları değiştirmez.
services:
  - type: web
    name: isg-suite-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /health
    branch: master
    disk:
      name: isg-suite-api-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      # Verified NACE records must always use the frozen five-topic snapshot;
      # cross-sector legacy aliases are not allowed to select live exam questions.
      - key: TRAINING_EXACT_NACE_EXAM_STRICT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: isg-suite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://www.isgsuite.tr
      - key: SMTP_HOST
        value: mail.isgsuite.tr
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: info@isgsuite.tr
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: info@isgsuite.tr
      - key: SMTP_USE_TLS
        value: "false"
      - key: SMTP_USE_SSL
        value: "false"
      # EİSA Global gelen kutusu — kullanıcı adı ve parola Render Secret olarak eklenir.
      - key: INBOUND_MAIL_ENABLED
        value: "true"
      - key: INBOUND_MAIL_HOST
        value: pop3.isgsuite.tr
      - key: INBOUND_MAIL_PORT
        value: "110"
      - key: INBOUND_MAIL_USERNAME
        value: info@isgsuite.tr
      - key: INBOUND_MAIL_PASSWORD
        sync: false
      - key: INBOUND_MAIL_USE_SSL
        value: "false"
      - key: INBOUND_MAIL_PROTOCOL
        value: pop3
      - key: INBOUND_MAIL_FOLDER
        value: INBOX
      - key: INBOUND_MAIL_SYNC_LIMIT
        value: "50"
      - key: INBOUND_MAIL_TIMEOUT_SEC
        value: "20"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ASYNC_JOBS_FORCE_OFF
        value: "false"
      - key: ASYNC_JOBS_ENABLED
        value: "true"
      - key: OBJECT_STORAGE_BACKEND
        value: "local"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_PREFIX
        value: "isg-suite-osgb"
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: UPLOAD_GATEWAY_ENABLED
        value: "true"
      - key: UPLOAD_GATEWAY_FORCE_OFF
        value: "false"
      - key: AUTH_REFRESH_COOKIE_ENABLED
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES_SHORT
        value: "15"
      - key: AUTH_REFRESH_COOKIE_FORCE_OFF
        value: "false"
      - key: HEALTH_FIELD_ENCRYPTION_ENABLED
        value: "true"
      - key: HEALTH_FIELD_ENCRYPTION_KEY
        sync: false
      - key: HEALTH_FIELD_ENCRYPTION_FORCE_OFF
        value: "false"
      - key: OBJECT_STORAGE_AUTO_CUTOVER
        value: "true"
      - key: OBJECT_STORAGE_FORCE_LOCAL
        value: "false"
      # One-shot safe mirror; enable temporarily only after R2 probe succeeds.
      # The job is idempotent and never deletes persistent-disk videos.
      - key: OBJECT_STORAGE_VIDEO_BACKFILL_ON_STARTUP
        value: "false"
      - key: BACKUP_RESTORE_ENABLED
        value: "true"
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_FORCE_OFF
        value: "false"
      - key: CLAMAV_HOST
        sync: false
      # Controlled compliance cutover: existing and pre-cutover verified
      # trainings keep the established certificate flow; only new verified
      # NACE snapshot trainings after the timestamp use completion preflight.
      - key: TRAINING_COMPLETION_STRICT
        value: "true"
      - key: TRAINING_COMPLETION_STRICT_AFTER
        value: "2026-08-20T12:10:00Z"
      - key: NACE_TRAINING_PRESENTATION_TRACEABILITY_FORCE_OFF
        value: "true"
      # Remote Basic OHS package/catalog management is live. Employee access
      # still requires an explicit assignment; the strict sector policy remains
      # enforced separately below.
      - key: REMOTE_BASIC_OHS_TRAINING_ENABLED
        value: "true"
      - key: REMOTE_BASIC_OHS_TRAINING_FORCE_OFF
        value: "false"
      - key: REMOTE_BASIC_OHS_VIDEO_MAX_UPLOAD_MB
        value: "2048"
      - key: REMOTE_BASIC_OHS_PLAYBACK_TTL_SECONDS
        value: "300"
      # Deploy ile davranış değişmez. R2 doğrulandıktan sonra Dashboard'dan
      # kontrollü açılır; FORCE_OFF anında mevcut yerel akışa döndürür.
      - key: REMOTE_BASIC_OHS_DIRECT_OBJECT_PLAYBACK_ENABLED
        value: "false"
      - key: REMOTE_BASIC_OHS_DIRECT_OBJECT_PLAYBACK_FORCE_OFF
        value: "false"
      - key: REMOTE_BASIC_OHS_DIRECT_OBJECT_PLAYBACK_TTL_SECONDS
        value: "3600"
      # Firma ve sektör ataması yöneticinin seçimiyle yapılır. Otomatik firma
      # ataması yoktur; boş şirket allowlist'i tüm firmaların yöneticinin
      # seçtiği yayımlanmış sektör paketlerini alabilmesini sağlar.
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_ENABLED
        value: "true"
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_FORCE_OFF
        value: "false"
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_PACKAGE_CODES
        value: "common-basic-ohs,construction-ohs,metal-machine-ohs,battery-production-ohs,food-production-ohs,logistics-warehouse-transport-ohs,chemical-paint-production-ohs,open-mine-quarry-aggregate-ohs,road-asphalt-infrastructure-ohs,office-general-ohs,health-services-ohs,working-at-height-ohs,emergency-teams-ohs"
      - key: REMOTE_BASIC_OHS_STRICT_POLICY_PILOT_COMPANY_IDS
        value: ""
      # 0.9.246 — Saha fotoğrafı AI risk analizi. Default heuristic mod
      # (ücretli API key gerekmez, görüntü içeriği analiz edilmez).
      # vision_provider=api + vision_api_key ile gerçek görüntü analizi açılır.
      - key: VISION_ANALYSIS_ENABLED
        value: "true"
      - key: VISION_PROVIDER
        value: "api"
      - key: VISION_API_BASE_URL
        value: "https://api.xkiro.com/v1"
      - key: VISION_API_MODEL
        value: "openai/gpt-5.4-mini"
      # Vision sağlayıcısının 30 saniyeyi aşabilen yanıtları için.
      - key: VISION_API_TIMEOUT_SEC
        value: "90"
      # API anahtarı gizli — Render dashboard'da manuel eklenir (sync: false).
      - key: VISION_API_KEY
        sync: false
      # 0.9.246 — Yeni GPS'li görsel saha denetimi akışı. Bu değişkenler
      # eski VISION_* akışından ayrıdır; anahtar yoksa backend mevcut
      # VISION_API_KEY sırrını güvenli geriye dönük uyumluluk köprüsüyle kullanır.
      - key: FIELD_AI_ENABLED
        value: "true"
      - key: FIELD_AI_FORCE_OFF
        value: "false"
      - key: FIELD_AI_PROVIDER
        value: "openai_compatible"
      - key: FIELD_AI_API_URL
        value: "https://api.xkiro.com/v1/chat/completions"
      - key: FIELD_AI_MODEL
        value: "openai/gpt-5.4-mini"
      - key: FIELD_AI_MODEL_VERSION
        value: "configured"
      - key: FIELD_AI_PROMPT_VERSION
        value: "field-visual-v2"
      - key: FIELD_AI_TIMEOUT_SECONDS
        value: "90"
      # Görsel saha AI pilotu için dış veri işleme açıkça etkinleştirilmiştir;
      # gerçek rapor bulgusu yine uzman onayından geçer.
      - key: FIELD_AI_DATA_PROCESSING_ALLOWED
        value: "true"
      # İstenirse yeni ayrı anahtar burada tanımlanabilir. Boş bırakıldığında
      # backend mevcut VISION_API_KEY değerini kullanır; gerçek sır commit edilmez.
      - key: FIELD_AI_API_KEY
        sync: false
      - key: CONTEXTUAL_ASSISTANT_ENABLED
        value: "true"
      - key: CONTEXTUAL_ASSISTANT_FORCE_OFF
        value: "false"
      - key: CONTEXTUAL_ASSISTANT_API_URL
        sync: false
      - key: CONTEXTUAL_ASSISTANT_API_KEY
        sync: false
      - key: CONTEXTUAL_ASSISTANT_MODEL
        sync: false
      - key: CONTEXTUAL_ASSISTANT_TIMEOUT_SECONDS
        value: "30"

  - type: cron
    name: isg-suite-api-warmup
    runtime: python
    rootDir: backend
    schedule: "*/14 * * * *"
    buildCommand: "true"
    startCommand: python scripts/warmup_ping.py
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WARMUP_API_URL
        value: https://isg-suite-api-1u9t.onrender.com

  - type: web
    name: isg-suite-web
    runtime: static
    rootDir: frontend
    # package.json owns the single canonical patch/test/build sequence. Do not
    # run training activation scripts twice here and again inside npm run build.
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    branch: master
    # EİSA canlı alan adı: kök alan adı www adresine yönlendirilir.
    domains:
      - www.isgsuite.tr
    # --- Güvenlik başlıkları (smoke test D2 bulgusu) ---
    # Render static sites, nginx.conf'u kullanmaz; headers direktifiyle
    # tüm yanıtlara güvenlik başlıkları eklenir.
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(self)
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Content-Security-Policy
        # Protected video may redirect to a short-lived R2/S3 HTTPS URL. Media
        # is permitted over HTTPS while scripts, frames and API connections
        # remain restricted to their existing origins.
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' https: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: /api/v1
      - key: VITE_CONTEXTUAL_ASSISTANT_ENABLED
        value: "true"
      - key: VITE_CONTEXTUAL_ASSISTANT_FORCE_OFF
        value: "false"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://isg-suite-api-1u9t.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://isg-suite-api-1u9t.onrender.com/health
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /.well-known/security.txt
        destination: /.well-known/security.txt
      - type: rewrite
        source: /manifest.webmanifest
        destination: /manifest.webmanifest
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: isg-suite-db
    databaseName: isgsuite
    user: isgsuite
