services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # ISG-012: yalnız yerel erişim; konteynerler arası trafik servis ağını kullanır.
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment}
      FRONTEND_ORIGIN: http://localhost:5173
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      # F-06: boşsa bellek içi rate-limit (mevcut davranış). Yerel test için
      # `docker compose --profile redis up -d` + REDIS_URL=redis://redis:6379/0
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

  # B-01 opsiyonel: ClamAV — `docker compose up -d clamav` + CLAMAV_HOST=clamav
  clamav:
    image: clamav/clamav:stable
    profiles: ["clamav"]
    ports:
      # ISG-012: clamd korumasız protokoldür; yalnız yerel erişime açılır.
      - "127.0.0.1:3310:3310"

  # F-06 opsiyonel: Redis (paylaşımlı rate-limit) — `docker compose --profile redis up -d`
  # + backend'e REDIS_URL=redis://redis:6379/0. Boşsa bellek içi yedek devrede kalır.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
