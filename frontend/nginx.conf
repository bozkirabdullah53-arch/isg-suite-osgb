server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' https: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /robots.txt {
    try_files $uri =404;
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /favicon.ico {
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location /icons/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
