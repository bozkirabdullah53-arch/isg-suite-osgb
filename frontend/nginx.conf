server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Güvenlik başlıkları (smoke test D2 bulgusu) ---
  # HSTS: HTTPS zorunluluğu (1 yıl, subdomain'ler dahil)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Clickjacking koruması
  add_header X-Frame-Options "DENY" always;
  # MIME sniffing koruması
  add_header X-Content-Type-Options "nosniff" always;
  # Referrer sızıntısı kontrolü
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # İstemci tarafı API kısıtlamaları
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
  # Content-Security-Policy: yalnızca izinli kaynaklar
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    try_files $uri /index.html;
  }
}
