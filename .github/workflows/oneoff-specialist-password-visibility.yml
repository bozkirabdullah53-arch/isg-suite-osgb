name: One-off specialist password visibility

on:
  push:
    branches:
      - hotfix/password-visibility-specialist
    paths:
      - '.github/workflows/oneoff-specialist-password-visibility.yml'

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Add independent password visibility controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/eisa.jsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('export function SpecialistRegisterPage')
          end = text.find('\nexport function ', start + 1)
          if end == -1:
              end = len(text)
          section = text[start:end]

          state_anchor = "  const [busy, setBusy] = useState(false);"
          if section.count(state_anchor) != 1:
              raise SystemExit(f'Expected one busy state in SpecialistRegisterPage, found {section.count(state_anchor)}')
          section = section.replace(
              state_anchor,
              "  const [showPassword, setShowPassword] = useState(false);\n"
              "  const [showPasswordConfirm, setShowPasswordConfirm] = useState(false);\n"
              + state_anchor,
              1,
          )

          old = '''              <label className="field"><span>Şifre *</span>\n                <input type="password" required minLength={10} value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} />\n              </label>\n              <label className="field"><span>Şifre tekrar *</span>\n                <input type="password" required minLength={10} value={form.password_confirm} onChange={(e) => setForm({ ...form, password_confirm: e.target.value })} />\n              </label>'''

          new = '''              <label className="field"><span>Şifre *</span>\n                <input type={showPassword ? 'text' : 'password'} required minLength={10} autoComplete="new-password" value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} />\n                <button type="button" className="mini secondary" style={{ marginTop: 6, width: 'fit-content', minWidth: 108 }} aria-pressed={showPassword} aria-label={showPassword ? 'Şifreyi gizle' : 'Şifreyi göster'} onClick={() => setShowPassword((v) => !v)}>\n                  {showPassword ? '🙈 Gizle' : '👁 Göster'}\n                </button>\n              </label>\n              <label className="field"><span>Şifre tekrar *</span>\n                <input type={showPasswordConfirm ? 'text' : 'password'} required minLength={10} autoComplete="new-password" value={form.password_confirm} onChange={(e) => setForm({ ...form, password_confirm: e.target.value })} />\n                <button type="button" className="mini secondary" style={{ marginTop: 6, width: 'fit-content', minWidth: 108 }} aria-pressed={showPasswordConfirm} aria-label={showPasswordConfirm ? 'Şifre tekrarını gizle' : 'Şifre tekrarını göster'} onClick={() => setShowPasswordConfirm((v) => !v)}>\n                  {showPasswordConfirm ? '🙈 Gizle' : '👁 Göster'}\n                </button>\n              </label>'''

          if section.count(old) != 1:
              raise SystemExit(f'Expected one password field block in SpecialistRegisterPage, found {section.count(old)}')
          section = section.replace(old, new, 1)
          updated = text[:start] + section + text[end:]
          path.write_text(updated, encoding='utf-8')
          PY

          git diff --check
          git diff -- frontend/src/eisa.jsx

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit and push to master
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/eisa.jsx
          git commit -m 'Add password show hide controls to specialist application'
          git push origin HEAD:master
