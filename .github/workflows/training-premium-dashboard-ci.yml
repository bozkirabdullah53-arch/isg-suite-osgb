name: Training Premium Dashboard CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-secret-key-at-least-32-characters-long
      DATABASE_URL: sqlite:///./training_dashboard_ci.db
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Premium dashboard and lifecycle regression
        run: >
          pytest -q
          tests/test_training_premium_dashboard_router_registration.py
          tests/test_training_premium_dashboard_v1.py
          tests/test_training_lifecycle_v2.py
          tests/test_training_completion.py
          tests/test_training_rules.py
          tests/test_training_question_selection_v2.py
          tests/test_training_presentation_phase8.py
          tests/test_training_presentation_phase9.py
          tests/test_training_presentation_phase10_chemicals.py
      - name: Read-only and rollback contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('../docs/training-premium-dashboard-v1.md').read_text(encoding='utf-8')
          required = [
              'TRAINING_PREMIUM_DASHBOARD_V1_ENABLED=true',
              'TRAINING_PREMIUM_DASHBOARD_V1_FORCE_OFF=true',
              'Migration yoktur',
              'Hiçbir eğitim otomatik tamamlanmaz',
              'salt okunurdur',
          ]
          missing = [item for item in required if item not in text]
          assert not missing, f'Premium dashboard release contract eksik: {missing}'
          print('OK: premium dashboard read-only/rollback contract')
          PY

  frontend-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npx vitest run src/training_premium_dashboard_logic.test.js
      - name: Lint
        run: npx eslint src/training_premium_dashboard_logic.js src/training_premium_dashboard_logic.test.js src/training_premium_dashboard_bridge_v2.js e2e/training-premium-dashboard.spec.js
      - name: Production bundle
        run: npx vite build
      - name: Desktop and mobile acceptance
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/training-premium-dashboard.spec.js
