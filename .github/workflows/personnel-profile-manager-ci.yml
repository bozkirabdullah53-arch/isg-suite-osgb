name: Personnel Profile Manager CI

on:
  push:
    branches: [master]
    paths:
      - "backend/app/api/personnel_profile*.py"
      - "backend/app/models/personnel_profile.py"
      - "backend/app/schemas/personnel_profile*.py"
      - "backend/app/services/personnel_profile*.py"
      - "backend/tests/test_personnel_profile*.py"
      - "backend/alembic/versions/0081_personnel_profiles.py"
      - "frontend/src/personnel_profile*"
      - "frontend/e2e/personnel-profile*.spec.js"
      - "frontend/index.html"
      - ".github/workflows/personnel-profile-manager-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/app/api/personnel_profile*.py"
      - "backend/app/models/personnel_profile.py"
      - "backend/app/schemas/personnel_profile*.py"
      - "backend/app/services/personnel_profile*.py"
      - "backend/tests/test_personnel_profile*.py"
      - "backend/alembic/versions/0081_personnel_profiles.py"
      - "frontend/src/personnel_profile*"
      - "frontend/e2e/personnel-profile*.spec.js"
      - "frontend/index.html"
      - ".github/workflows/personnel-profile-manager-ci.yml"

jobs:
  profile-backend-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      SECRET_KEY: personnel-profile-ci-secret-key-32-chars
      DATABASE_URL: sqlite:///./personnel_profile_ci.db
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Profile security and management tests
        run: >
          pytest -q
          tests/test_personnel_profile_readonly.py
          tests/test_personnel_profile_core.py
          tests/test_personnel_profile_management.py
          tests/test_company_access.py
          tests/test_tenant_context.py

  profile-backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: isg
          POSTGRES_PASSWORD: isg
          POSTGRES_DB: personnel_profile_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isg -d personnel_profile_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      SECRET_KEY: personnel-profile-ci-secret-key-32-chars
      DATABASE_URL: postgresql+psycopg://isg:isg@localhost:5432/personnel_profile_ci
      CI_POSTGRES: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Upgrade and schema parity
        run: |
          alembic upgrade head
          python scripts/ci_postgres_parity.py
      - name: Profile core and management tests
        run: >
          pytest -q
          tests/test_personnel_profile_core.py
          tests/test_personnel_profile_management.py
      - name: Existing tables and isolated profile tables remain intact
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          engine = create_engine(os.environ["DATABASE_URL"])
          inspector = inspect(engine)
          for table in (
              "employees",
              "isg_professionals",
              "users",
              "workplace_assignments",
              "personnel_profiles",
              "personnel_profile_contacts",
              "personnel_profile_competencies",
              "personnel_profile_experiences",
          ):
              assert inspector.has_table(table), table
          print("OK: existing identities and isolated profile tables coexist")
          PY

  profile-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Profile unit tests
        run: npx vitest run src/personnel_profile_readonly_logic.test.js src/personnel_profile_manager_logic.test.js
      - name: Lint and build
        run: |
          npm run lint
          npm run build
      - name: Full manager desktop and mobile E2E
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/personnel-profile-sidebar.spec.js
