name: Natural Turkish Promo Final
on:
  push:
    branches: ['tmp/promo-tr-voice-20260909']
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install --quiet pillow
          python tools/tmp_render_promo_tr.py
      - run: |
          curl -L --fail -o v1.mp3 'https://cdn.creativeclaw.co/u/38badd12/audio/7e74f17d-e7bb-44c3-b94d-30a7e941fa76.mp3'
          curl -L --fail -o v2.mp3 'https://cdn.creativeclaw.co/u/38badd12/audio/dc872337-7fc5-4e7c-a4fe-d5fcba34e4f4.mp3'
          curl -L --fail -o v3.mp3 'https://cdn.creativeclaw.co/u/38badd12/audio/162e2e39-295c-4b60-9e54-3f82fa70c8b2.mp3'
          printf "file '%s'\nfile '%s'\nfile '%s'\n" "$PWD/v1.mp3" "$PWD/v2.mp3" "$PWD/v3.mp3" > voices.txt
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i voices.txt -ar 48000 -ac 2 raw.wav
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 raw.wav)
          FACTOR=$(python -c "d=float('$DUR'); print(max(0.85,min(1.15,d/58.2)))")
          ffmpeg -y -hide_banner -loglevel error -i raw.wav -af "atempo=$FACTOR,adelay=500|500,apad=pad_dur=60,atrim=0:60,highpass=f=70,lowpass=f=10500,acompressor=threshold=-21dB:ratio=2:attack=14:release=180:makeup=1,alimiter=limit=0.95" -ar 48000 -ac 2 narration.wav
      - run: |
          mkdir -p clips
          for i in $(seq -w 1 12); do ffmpeg -y -hide_banner -loglevel error -loop 1 -framerate 24 -i "promo_render/scene_${i}.png" -t 5 -vf "scale=1120:1991,zoompan=z='min(zoom+0.00035,1.035)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=120:s=1080x1920:fps=24,fade=t=in:st=0:d=0.15,fade=t=out:st=4.85:d=0.15" -an -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p "clips/c_${i}.mp4"; done
          rm -f concat.txt
          for i in $(seq -w 1 12); do echo "file '$PWD/clips/c_${i}.mp4'" >> concat.txt; done
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i concat.txt -c copy silent.mp4
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=110:sample_rate=48000:duration=60" -f lavfi -i "sine=frequency=164.81:sample_rate=48000:duration=60" -filter_complex "[0:a]volume=0.015[a0];[1:a]volume=0.008[a1];[a0][a1]amix=inputs=2:normalize=0,afade=t=in:st=0:d=1,afade=t=out:st=58.5:d=1.5[m]" -map "[m]" -ar 48000 -ac 2 music.wav
          ffmpeg -y -hide_banner -loglevel error -i silent.mp4 -i narration.wav -i music.wav -filter_complex "[1:a]volume=1.02[v];[2:a]volume=0.32[m];[v][m]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -t 60 -movflags +faststart ISG_Suite_Uzaktan_Egitim_60sn_Natural_Turkce_Final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: isg-suite-natural-turkce-final
          path: ISG_Suite_Uzaktan_Egitim_60sn_Natural_Turkce_Final.mp4
          retention-days: 1
