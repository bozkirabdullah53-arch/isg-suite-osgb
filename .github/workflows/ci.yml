name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: NACE classification coverage
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
          DATABASE_URL: sqlite:///./ci_test.db
          PYTHONPATH: .
        run: |
          python scripts/audit_training_nace_classification.py
          python scripts/list_training_nace_review_profiles.py | tee nace-review-profiles.jsonl
      - name: Upload NACE review profile summary
        uses: actions/upload-artifact@v4
        with:
          name: nace-review-profiles
          path: backend/nace-review-profiles.jsonl
          if-no-files-found: error
          retention-days: 7
      - name: Pytest (SQLite smoke + complete training workflow)
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
          DATABASE_URL: sqlite:///./ci_test.db
          PYTHONPATH: .
        run: >
          pytest -q
          tests/test_security_config.py
          tests/test_release_status.py
          tests/test_stored_files.py
          tests/test_object_store.py
          tests/test_object_storage_remote_required.py
          tests/test_remote_training_video_r2_backfill.py
          tests/test_remote_basic_ohs_video_training.py
          tests/test_system_backfill.py
          tests/test_rate_limit_runtime_fallback.py
          tests/test_health_crypto_inventory.py
          tests/test_training_runtime_patches.py
          tests/test_training_nace_classification.py
          tests/test_training_question_bank.py
          tests/test_training_exact_question_factory.py
          tests/test_training_question_selection_v2.py
          tests/test_training_question_selection_smoke_script.py
          tests/test_training_completion.py
          tests/test_training_strict_cutover.py
          tests/test_training_rules.py
          tests/test_training_presentation_readiness.py
          tests/test_training_presentation_contract.py
          tests/test_training_presentation_versions.py
          tests/test_training_presentation_renderer.py
          tests/test_training_presentation_generation.py
          tests/test_training_editor_teaching_v3.py
          tests/test_training_presentation_api_phase4.py
          tests/test_training_presentation_phase9.py
          tests/test_training_presentation_phase9_scope_guard.py
          tests/test_csgb_readiness_advice.py
          tests/test_integration_readiness.py
          tests/test_csgb_audit_bundle.py
          tests/test_pro_performance_export.py
          tests/test_committee_professional.py
          tests/test_company_access.py
          tests/test_workplace_manager_access.py
          tests/test_personnel_profile_readonly.py
          tests/test_personnel_profile_core.py
          tests/test_clamav_scan.py
          tests/test_capacity_engine.py
          tests/test_backup_restore.py
          tests/test_active_osgb.py
          tests/test_ci_postgres_parity.py
          tests/test_tenant_context.py
          tests/test_p1_auth_assignment.py
          tests/test_job_queue.py
          tests/test_legal_consent.py
          tests/test_memberships.py
          tests/test_p1_version_jobs.py
          tests/test_rls_membership_access.py
          tests/test_refresh_cookie_rollout.py

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: isg
          POSTGRES_PASSWORD: isg
          POSTGRES_DB: isg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isg -d isg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-secret-key-at-least-32-characters-long
      DATABASE_URL: postgresql+psycopg://isg:isg@localhost:5432/isg_ci
      CI_POSTGRES: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Postgres schema parity
        run: python scripts/ci_postgres_parity.py
      - name: Pytest (Postgres parity + personnel + training + committee workflow)
        run: >
          pytest -q
          tests/test_ci_postgres_parity.py
          tests/test_personnel_profile_core.py
          tests/test_training_nace_classification.py
          tests/test_training_presentation_versions.py
          tests/test_training_presentation_generation.py
          tests/test_training_editor_teaching_v3.py
          tests/test_committee_workflow.py
      - name: Personnel profile migration downgrade isolation
        run: |
          alembic downgrade 0080_presentation_approvals
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          url = os.environ["DATABASE_URL"]
          engine = create_engine(url)
          inspector = inspect(engine)
          for table in (
              "personnel_profiles",
              "personnel_profile_contacts",
              "personnel_profile_competencies",
              "personnel_profile_experiences",
          ):
              assert not inspector.has_table(table), table
          for table in (
              "employees",
              "isg_professionals",
              "users",
              "workplace_assignments",
              "training_sessions",
              "training_presentation_versions",
              "training_presentation_approvals",
          ):
              assert inspector.has_table(table), table
          print("OK: personnel profile downgrade removed only isolated profile tables")
          PY
      - name: Personnel profile migration re-upgrade parity
        run: |
          alembic upgrade head
          python scripts/ci_postgres_parity.py
      - name: Presentation migration downgrade isolation
        run: |
          alembic downgrade 0078_training_nace
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          url = os.environ["DATABASE_URL"]
          engine = create_engine(url)
          inspector = inspect(engine)
          assert not inspector.has_table("training_presentation_versions")
          assert inspector.has_table("training_sessions")
          assert inspector.has_table("training_nace_snapshots")
          assert inspector.has_table("training_exam_snapshots")
          print("OK: presentation downgrade removed only the isolated presentation table")
          PY
      - name: Presentation migration re-upgrade parity
        run: |
          alembic upgrade head
          python scripts/ci_postgres_parity.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: E2E smoke
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Audit
        run: npm audit --omit=dev
