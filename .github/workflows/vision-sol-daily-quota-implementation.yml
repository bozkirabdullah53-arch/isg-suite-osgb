name: Vision Sol daily quota implementation

on:
  push:
    branches:
      - feature/vision-sol-daily-quota

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vision-sol-daily-quota
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: RED - quota test must fail before implementation
        working-directory: backend
        run: |
          set +e
          pytest -q tests/test_vision_daily_quota.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected quota test to fail before implementation."
            exit 1
          fi
          echo "RED confirmed."

      - name: Apply implementation
        run: python tools/apply_vision_quota_upgrade.py

      - name: GREEN - focused regression tests
        working-directory: backend
        run: pytest -q tests/test_vision_daily_quota.py tests/test_ai_vision.py tests/test_ai_gateway_config.py

      - name: Commit implementation
        run: |
          rm -f tools/apply_vision_quota_upgrade.py .github/workflows/vision-sol-daily-quota-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: cap vision AI usage and upgrade model"
          git push origin HEAD:feature/vision-sol-daily-quota
