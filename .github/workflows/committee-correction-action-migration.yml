name: Committee correction action migration

on:
  push:
    branches:
      - agent/committee-eyas-workflow-removal-2026-08-05
    paths:
      - scripts/patch_committee_correction_action.py
      - .github/workflows/committee-correction-action-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/committee-eyas-workflow-removal-2026-08-05
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply correction action migration
        run: python scripts/patch_committee_correction_action.py
      - name: Commit generated source
        run: |
          if git diff --quiet -- backend/app/api/committee_professional.py backend/app/services/committee_workflow.py backend/tests/test_committee_workflow.py frontend/src/committee_approval_queue.jsx frontend/src/committee-workflow.css; then
            echo "Correction action already applied."
            exit 0
          fi
          git config user.name "isg-suite-automation"
          git config user.email "automation@isgsuite.tr"
          git add backend/app/api/committee_professional.py backend/app/services/committee_workflow.py backend/tests/test_committee_workflow.py frontend/src/committee_approval_queue.jsx frontend/src/committee-workflow.css
          git commit -m "feat(committee): distinguish rejection from return for correction"
          git push origin HEAD:agent/committee-eyas-workflow-removal-2026-08-05
