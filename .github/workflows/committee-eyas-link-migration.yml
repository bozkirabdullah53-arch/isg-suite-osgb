name: Committee EYAS linkage correction

on:
  push:
    branches:
      - agent/committee-eyas-workflow-removal-2026-08-05
    paths:
      - scripts/patch_committee_eyas_link.py
      - .github/workflows/committee-eyas-link-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/committee-eyas-workflow-removal-2026-08-05
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply linkage correction
        run: python scripts/patch_committee_eyas_link.py
      - name: Commit generated source
        run: |
          if git diff --quiet -- backend/app/services/committee_workflow.py backend/app/api/eyas.py backend/tests/test_committee_workflow.py; then
            echo "Linkage correction already applied."
            exit 0
          fi
          git config user.name "isg-suite-automation"
          git config user.email "automation@isgsuite.tr"
          git add backend/app/services/committee_workflow.py backend/app/api/eyas.py backend/tests/test_committee_workflow.py
          git commit -m "fix(committee): keep EYAS document FK semantics and link through workflow id"
          git push origin HEAD:agent/committee-eyas-workflow-removal-2026-08-05
