name: Apply Committee Frontend Patch

on:
  pull_request:
    branches: [master]
    paths:
      - "scripts/patch_committee_frontend.py"
      - ".github/workflows/apply-committee-frontend-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply idempotent patch
        run: python scripts/patch_committee_frontend.py
      - name: Commit generated frontend changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/compliance_registers.jsx frontend/src/theme-modern.css
          if git diff --cached --quiet; then
            echo "No generated frontend changes"
            exit 0
          fi
          git commit -m "fix(committee): apply professional member selection UI"
          git push origin HEAD:${{ github.head_ref }}
