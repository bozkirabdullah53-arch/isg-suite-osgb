name: Committee v2 import migration

on:
  push:
    branches:
      - agent/committee-eyas-workflow-removal-2026-08-05
    paths:
      - scripts/patch_committee_v2_imports.py
      - .github/workflows/committee-v2-import-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/committee-eyas-workflow-removal-2026-08-05
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply import migration
        run: python scripts/patch_committee_v2_imports.py
      - name: Commit generated source
        run: |
          if git diff --quiet -- frontend/src/main.jsx; then
            echo "Import migration already applied."
            exit 0
          fi
          git config user.name "isg-suite-automation"
          git config user.email "automation@isgsuite.tr"
          git add frontend/src/main.jsx
          git commit -m "refactor(committee): route dashboards to workflow-enabled screens"
          git push origin HEAD:agent/committee-eyas-workflow-removal-2026-08-05
