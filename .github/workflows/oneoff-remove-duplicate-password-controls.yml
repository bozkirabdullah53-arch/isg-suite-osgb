name: One-off remove duplicate password controls

on:
  push:
    branches:
      - hotfix/password-visibility-specialist
    paths:
      - '.github/workflows/oneoff-remove-duplicate-password-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove duplicate white password buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/eisa.jsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace("  const [showPassword, setShowPassword] = useState(false);\n  const [showPasswordConfirm, setShowPasswordConfirm] = useState(false);\n", "")

          old1 = '''              <label className="field"><span>Şifre *</span>\n                <input type={showPassword ? 'text' : 'password'} required minLength={10} autoComplete="new-password" value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} />\n                <button type="button" className="mini secondary" style={{ marginTop: 6, width: 'fit-content', minWidth: 108 }} aria-pressed={showPassword} aria-label={showPassword ? 'Şifreyi gizle' : 'Şifreyi göster'} onClick={() => setShowPassword((v) => !v)}>\n                  {showPassword ? '🙈 Gizle' : '👁 Göster'}\n                </button>\n              </label>'''
          new1 = '''              <label className="field"><span>Şifre *</span>\n                <input type="password" required minLength={10} value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} />\n              </label>'''

          old2 = '''              <label className="field"><span>Şifre tekrar *</span>\n                <input type={showPasswordConfirm ? 'text' : 'password'} required minLength={10} autoComplete="new-password" value={form.password_confirm} onChange={(e) => setForm({ ...form, password_confirm: e.target.value })} />\n                <button type="button" className="mini secondary" style={{ marginTop: 6, width: 'fit-content', minWidth: 108 }} aria-pressed={showPasswordConfirm} aria-label={showPasswordConfirm ? 'Şifre tekrarını gizle' : 'Şifre tekrarını göster'} onClick={() => setShowPasswordConfirm((v) => !v)}>\n                  {showPasswordConfirm ? '🙈 Gizle' : '👁 Göster'}\n                </button>\n              </label>'''
          new2 = '''              <label className="field"><span>Şifre tekrar *</span>\n                <input type="password" required minLength={10} value={form.password_confirm} onChange={(e) => setForm({ ...form, password_confirm: e.target.value })} />\n              </label>'''

          if old1 not in text or old2 not in text:
              raise SystemExit('Expected duplicate password button blocks were not found')

          text = text.replace(old1, new1).replace(old2, new2)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- frontend/src/eisa.jsx

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit and push to master
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/eisa.jsx
          git commit -m 'Remove duplicate password visibility buttons'
          git push origin HEAD:master
