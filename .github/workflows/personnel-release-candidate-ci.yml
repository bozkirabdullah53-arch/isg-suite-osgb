name: Personnel Release Candidate CI

on:
  push:
    branches:
      - feature/personnel-profile-documents-ui-phase-4c
  workflow_dispatch:

concurrency:
  group: personnel-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      SECRET_KEY: personnel-release-candidate-secret-key-32
      DATABASE_URL: sqlite:///./personnel_release_candidate.db
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: SQLite personnel and security regression
        run: >
          pytest -q
          tests/test_personnel_profile_readonly.py
          tests/test_personnel_profile_core.py
          tests/test_personnel_profile_management.py
          tests/test_personnel_profile_documents.py
          tests/test_personnel_profile_file_security.py
          tests/test_company_access.py
          tests/test_tenant_context.py
          tests/test_object_storage_remote_required.py
          tests/test_clamav_scan.py

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: isg
          POSTGRES_PASSWORD: isg
          POSTGRES_DB: personnel_release_candidate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isg -d personnel_release_candidate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      SECRET_KEY: personnel-release-candidate-secret-key-32
      DATABASE_URL: postgresql+psycopg://isg:isg@localhost:5432/personnel_release_candidate
      CI_POSTGRES: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Upgrade and schema parity
        run: |
          alembic upgrade head
          python scripts/ci_postgres_parity.py
      - name: PostgreSQL personnel, RLS and document regression
        run: >
          pytest -q
          tests/test_personnel_profile_core.py
          tests/test_personnel_profile_management.py
          tests/test_personnel_profile_documents.py
          tests/test_personnel_profile_file_security.py
          tests/test_ci_postgres_parity.py
      - name: Isolated 0082 rollback and re-upgrade
        run: |
          alembic downgrade 0081_personnel_profile_core
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          engine = create_engine(os.environ["DATABASE_URL"])
          inspector = inspect(engine)
          assert not inspector.has_table("personnel_profile_documents")
          for table in (
              "employees",
              "isg_professionals",
              "users",
              "workplace_assignments",
              "personnel_profiles",
              "personnel_profile_contacts",
              "personnel_profile_competencies",
              "personnel_profile_experiences",
          ):
              assert inspector.has_table(table), table
          print("OK: 0082 downgrade removed only personnel_profile_documents")
          PY
          alembic upgrade head
          python scripts/ci_postgres_parity.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Personnel unit tests
        run: >
          npx vitest run
          src/personnel_profile_readonly_logic.test.js
          src/personnel_profile_manager_logic.test.js
          src/personnel_profile_documents_logic.test.js
          src/personnel_profile_documents_bridge.test.js
      - name: Lint and production build
        run: |
          npm run lint
          npm run build
      - name: Personnel desktop, tablet, mobile and documents E2E
        run: |
          npx playwright install --with-deps chromium
          npx playwright test \
            e2e/personnel-profile-readonly.spec.js \
            e2e/personnel-profile-sidebar.spec.js \
            e2e/personnel-profile-documents.spec.js
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: personnel-release-candidate-e2e-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7
