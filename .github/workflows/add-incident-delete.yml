name: Add incident delete

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    # One-time hotfix is already in master; keep this manual definition inert.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch backend and frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('backend/app/api/incidents.py')
          text = backend.read_text(encoding='utf-8')
          marker = '@router.patch("/{incident_id}", response_model=IncidentResponse)\ndef update_incident(\n'
          delete_endpoint = '''@router.delete("/{incident_id}")
def delete_incident(
    incident_id: int,
    db: Session = Depends(get_db),
    user: User = Depends(require_roles(*EDIT_ROLES)),
):
    """Olay kaydını kök neden ve bağlı DÖF kayıtlarıyla birlikte kalıcı siler."""
    row = _load(db, incident_id)
    ensure_access(db, user, row.company_id)
    form_no = row.form_no
    db.delete(row)
    db.commit()
    return {"ok": True, "id": incident_id, "message": f"{form_no} numaralı olay kaydı silindi."}


'''
          if '@router.delete("/{incident_id}")' not in text:
              if marker not in text:
                  raise SystemExit('Backend marker not found')
              text = text.replace(marker, delete_endpoint + marker, 1)
              backend.write_text(text, encoding='utf-8')

          frontend = Path('frontend/src/incidents.jsx')
          text = frontend.read_text(encoding='utf-8')
          function_marker = '  async function closeIncident() {\n'
          delete_function = '''  async function deleteIncident(row) {
    if (!canEdit || !row?.id) return;
    const ok = window.confirm(
      `${row.form_no || 'Bu olay kaydı'} kalıcı olarak silinsin mi? Bu işlem geri alınamaz.`,
    );
    if (!ok) return;
    setErr('');
    try {
      await api(`/incidents/${row.id}`, {method: 'DELETE'});
      if (detail?.id === row.id) setDetail(null);
      await load();
    } catch (x) {
      setErr(x.message || 'Olay kaydı silinemedi.');
    }
  }

'''
          if 'async function deleteIncident(row)' not in text:
              if function_marker not in text:
                  raise SystemExit('Frontend function marker not found')
              text = text.replace(function_marker, delete_function + function_marker, 1)

          old_action = '''                  <td>
                    <button className="mini" type="button" onClick={() => openDetail(r.id)}>Detay</button>
                  </td>
'''
          new_action = '''                  <td>
                    <div style={{display: 'flex', gap: 8, flexWrap: 'wrap'}}>
                      <button className="mini" type="button" onClick={() => openDetail(r.id)}>Detay</button>
                      {canEdit && (
                        <button
                          className="mini secondary"
                          type="button"
                          onClick={() => deleteIncident(r)}
                          style={{color: '#b42318', borderColor: 'rgba(180,35,24,.28)'}}
                        >
                          Sil
                        </button>
                      )}
                    </div>
                  </td>
'''
          if 'onClick={() => deleteIncident(r)}' not in text:
              if old_action not in text:
                  raise SystemExit('Frontend action block not found')
              text = text.replace(old_action, new_action, 1)
          frontend.write_text(text, encoding='utf-8')
          PY

      - name: Validate backend syntax
        run: python -m py_compile backend/app/api/incidents.py

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/incidents.py frontend/src/incidents.jsx frontend/dist
          git commit -m "feat: olay kayıtlarına güvenli silme seçeneği ekle"
          git push origin master
