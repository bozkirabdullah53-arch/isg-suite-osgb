name: security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Yillik statik+dinamik test (Gizlilik Sozlesmesi 3.22) - haftalik calisma
    - cron: '0 3 * * 1'

jobs:
  sast:
    name: Statik analiz (bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bandit kur
        run: pip install bandit
      - name: Statik guvenlik taramasi
        run: bandit -r app -ll -f json -o bandit-report.json || true
      - name: Yuksek/Kritik bulgu kontrolu
        # Yanlis pozitifler (B608 parametrik sorgular) haricinde
        # Yuksek/Kritik seviye bulgu varsa build basarisiz olur.
        run: |
          python - <<'EOF'
          import json
          data = json.load(open('bandit-report.json'))
          high = [r for r in data.get('results', []) if r['issue_severity'] in ('HIGH','CRITICAL')]
          if high:
              print('Yuksek/Kritik bulgu tespit edildi:')
              for h in high:
                  print(f"  [{h['issue_severity']}] {h['test_id']} {h['filename']}:{h['line_number']}")
              raise SystemExit(1)
          print('Yuksek/Kritik bulgu yok (dusuk/orta yanlis pozitifler Kabul edildi).')
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json

  dependency-audit:
    name: Bagimlilik denetimi (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend bagimlilik denetimi
        working-directory: backend
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --strict
      - name: Frontend bagimlilik denetimi
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev
