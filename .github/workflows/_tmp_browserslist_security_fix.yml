name: _tmp_browserslist_security_fix

on:
  push:
    branches:
      - feature/workplace-panel-tenant-safe

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update only Browserslist lock resolution
        working-directory: frontend
        run: npm update browserslist --package-lock-only --ignore-scripts
      - name: Verify patched Browserslist
        working-directory: frontend
        run: |
          node -e "const p=require('./package-lock.json'); const v=p.packages?.['node_modules/browserslist']?.version; if(v !== '4.28.7') { console.error('Expected browserslist 4.28.7, got', v); process.exit(1); } console.log('Browserslist', v);"
          npm audit --omit=dev
      - name: Commit lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git diff --cached --quiet && { echo 'No lockfile changes'; exit 0; }
          git commit -m 'fix: patch browserslist security vulnerability'
          git push
